name: AEN provisioner proof

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provisioner-native:
    name: ${{ matrix.os }} secure snapshot and HTTP
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve dependencies
        run: moon update
      - name: Check native packages strictly
        run: moon check --target native --warn-list +73 --deny-warn
      - name: Build provisioner release executable
        run: moon build cmd/aen-provisioner --target native --release
      - name: Prove snapshot, lease, refusal, and HTTP behavior
        run: moon test aen_provisioner_service aen_backend --target native -v

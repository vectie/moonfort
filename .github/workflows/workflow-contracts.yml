name: Workflow security contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-aen-workflow-contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prove production canary workflow fails closed hermetically
        run: scripts/test-real-aen-canary-workflow.sh
      - name: Prove MoonClaw execution-boundary guard rejects new authority
        run: tests/execution-boundary-guard-test.sh
